<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ngày Hội LKN 2026 - Khoa YHCT</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <!-- TÍCH HỢP 2 THƯ VIỆN Y HỆT FILE CỦA CHỊ BẠN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root { --primary: #8B1538; --bg-glass: rgba(255, 255, 255, 0.4); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans', sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: url('https://lh3.googleusercontent.com/d/1cxyOiGghKL4M2BbcB4NgpN1of8dbxMcE') center/cover; z-index: -1;
    }
    .card {
      background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      width: 100%; max-width: 420px; padding: 25px 20px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .logo { text-align: center; margin-bottom: 15px; } .logo img { max-width: 140px; }
    h2, h3 { color: var(--primary); text-align: center; margin-bottom: 15px; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #EAD5E7; border-radius: 8px; font-size: 15px; outline: none; }
    input:focus { border-color: var(--primary); }
    button { width: 100%; padding: 13px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 10px; }
    .btn-main { background: var(--primary); color: white; }
    .btn-sub { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .role-switch { text-align: center; margin-top: 15px; font-size: 13px; color: var(--primary); text-decoration: underline; cursor: pointer; }
    .hidden { display: none; }

    /* KHUNG HIỂN THỊ QR CHUẨN ĐỊNH DẠNG */
    #qr-canvas-box { display: flex; justify-content: center; align-items: center; margin: 15px 0; padding: 15px; background: white; border-radius: 16px; min-height: 230px; border: 2px solid #EAD5E7; }
    .loader { text-align: center; color: var(--primary); font-weight: bold; margin: 10px 0; display: none; }

    /* THANH ĐẾM NGƯỢC 5 GIÂY */
    .timer-bar-bg { width: 100%; background-color: #e2e8f0; height: 8px; border-radius: 9999px; overflow: hidden; margin-top: 8px; }
    .timer-bar-fill { background: linear-gradient(to right, #8B1538, #d97706); height: 100%; width: 100%; transition: width 0.3s linear; }

    .dev-credit {
      text-align: center;
      font-size: 13px;
      color: var(--primary);
      opacity: 1;
      margin-top: 25px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 0.5px;
      text-shadow: 0px 1px 3px rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo"><img src="https://lh3.googleusercontent.com/d/1pX-U4BcmFGPe6eBJL5FoXz-UHnUtg8p4"></div>
  <div class="loader" id="loader">Đang xử lý...</div>

  <!-- 1. FORM SINH VIÊN -->
  <div id="studentLoginBox">
    <h2>NGÀY HỘI HỌC THUẬT & THỬ THÁCH ANH TÀI</h2>
    <input type="text" id="svMssv" placeholder="Nhập MSSV">
    <input type="text" id="svHoTen" placeholder="Nhập Họ và Tên">
    <input type="text" id="svLop" placeholder="Nhập Lớp (Ví dụ: YHCT24)">
    <button class="btn-main" onclick="handleStudentLogin()">Đăng nhập Hệ Thống</button>
    <div class="role-switch" onclick="switchRole('ctv')">🔐 Đăng nhập dành cho Ban Tổ Chức...</div>
  </div>

  <!-- 2. FORM CTV -->
  <div id="ctvLoginBox" class="hidden">
    <h2>QUẢN LÝ TRẠM</h2>
    <input type="text" id="ctvUser" placeholder="ID Tài khoản đã cấp">
    <input type="password" id="ctvPass" placeholder="Password">
    <button class="btn-main" onclick="handleCtvLogin()">Đăng Nhập Trạm</button>
    <div class="role-switch" onclick="switchRole('student')">⬅ Quay lại Đăng nhập Sinh viên</div>
  </div>

  <!-- 3. DASHBOARD SINH VIÊN -->
  <div id="studentDash" class="hidden">
    <h2>CHÀO MỪNG BẠN</h2>
    <p style="text-align:center; margin-bottom:15px;"><b id="svNameDisp"></b> - <span id="svClassDisp"></span></p>
    <button class="btn-main" onclick="openStudentScanner()">📸 Quét Mã QR Tại Trạm</button>
    <button class="btn-sub" onclick="showUpdateModal()">✏ Sửa thông tin cá nhân</button>
    <div id="svStatus" style="text-align:center; font-weight:bold; margin-top:15px; color:var(--primary);"></div>
  </div>

  <!-- 4. DASHBOARD CTV (HIỂN THỊ MÃ QR ĐỔI MỖI 5 GIÂY) -->
  <div id="ctvDash" class="hidden">
    <h2 id="stationTitle">Tên Trạm</h2>

    <div id="qr-canvas-box"></div>

    <div style="margin-top: 10px;">
      <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold; color:#475569;">
        <span>Tự đổi mã sau:</span>
        <span id="time-countdown" style="color:var(--primary);">5s</span>
      </div>
      <div class="timer-bar-bg">
        <div id="progress-bar" class="timer-bar-fill"></div>
      </div>
    </div>

    <p style="text-align:center; font-size:12px; color:#000; margin-top:15px;">Trực trạm: <b id="ctvUserDisp"></b></p>
  </div>

  <!-- 5. KHUNG CAMERA QUÉT -->
  <div id="scannerBox" class="hidden">
    <h3>HÃY QUÉT MÃ QR CỦA TRẠM</h3>
    <div id="reader" style="width:100%; margin:15px 0;"></div>
    <button class="btn-sub" onclick="closeStudentScanner()">Hủy Quét</button>
  </div>

  <div class="dev-credit">This website was developed by Le Thanh Hai</div>
</div>

<script>

  function customMD5(string) {
    function rotateLeft(lValue, iShiftBits) { return (lValue << iShiftBits) | (lValue >>> (32 - iShiftBits)); }
    function addUnsigned(lX, lY) {
      var lX4, lY4, lX8, lY8, lResult;
      lX8 = (lX & 0x80000000); lY8 = (lY & 0x80000000);
      lX4 = (lX & 0x40000000); lY4 = (lY & 0x40000000);
      lResult = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
      if (lX4 & lY4) return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
      if (lX4 | lY4) {
        if (lResult & 0x40000000) return (lResult ^ 0xC0000000 ^ lX8 ^ lY8);
        else return (lResult ^ 0x40000000 ^ lX8 ^ lY8);
      } else return (lResult ^ lX8 ^ lY8);
    }
    function F(x, y, z) { return (x & y) | ((~x) & z); }
    function G(x, y, z) { return (x & z) | (y & (~z)); }
    function H(x, y, z) { return (x ^ y ^ z); }
    function I(x, y, z) { return (y ^ (x | (~z))); }
    function FF(a,b,c,d,x,s,ac) { a = addUnsigned(a, addUnsigned(addUnsigned(F(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); }
    function GG(a,b,c,d,x,s,ac) { a = addUnsigned(a, addUnsigned(addUnsigned(G(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); }
    function HH(a,b,c,d,x,s,ac) { a = addUnsigned(a, addUnsigned(addUnsigned(H(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); }
    function II(a,b,c,d,x,s,ac) { a = addUnsigned(a, addUnsigned(addUnsigned(I(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); }
    function convertToWordArray(string) {
      var lMessageLength = string.length, lNumberOfWords_temp1 = lMessageLength + 8,
          lNumberOfWords_temp2 = (lNumberOfWords_temp1 - (lNumberOfWords_temp1 % 64)) / 64,
          lNumberOfWords = (lNumberOfWords_temp2 + 1) * 16, lWordArray = Array(lNumberOfWords - 1),
          lBytePosition = 0, lByteCount = 0, lWordCount;
      while (lByteCount < lMessageLength) {
        lWordCount = (lByteCount - (lByteCount % 4)) / 4;
        lBytePosition = (lByteCount % 4) * 8;
        lWordArray[lWordCount] = (lWordArray[lWordCount] | (string.charCodeAt(lByteCount) << lBytePosition));
        lByteCount++;
      }
      lWordCount = (lByteCount - (lByteCount % 4)) / 4;
      lBytePosition = (lByteCount % 4) * 8;
      lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80 << lBytePosition);
      lWordArray[lNumberOfWords - 2] = lMessageLength << 3;
      lWordArray[lNumberOfWords - 1] = lMessageLength >>> 29;
      return lWordArray;
    }
    function wordToHex(lValue) {
      var WordToHexValue = "", WordToHexValue_temp = "", lByte, lCount;
      for (lCount = 0; lCount <= 3; lCount++) {
        lByte = (lValue >>> (lCount * 8)) & 255;
        WordToHexValue_temp = "0" + lByte.toString(16);
        WordToHexValue = WordToHexValue + WordToHexValue_temp.substr(WordToHexValue_temp.length - 2, 2);
      }
      return WordToHexValue;
    }
    function utf8Encode(string) {
      string = string.replace(/\r\n/g, "\n"); var utftext = "";
      for (var n = 0; n < string.length; n++) {
        var c = string.charCodeAt(n);
        if (c < 128) utftext += String.fromCharCode(c);
        else if ((c > 127) && (c < 2048)) {
          utftext += String.fromCharCode((c >> 6) | 192);
          utftext += String.fromCharCode((c & 63) | 128);
        } else {
          utftext += String.fromCharCode((c >> 12) | 224);
          utftext += String.fromCharCode(((c >> 6) & 63) | 128);
          utftext += String.fromCharCode((c & 63) | 128);
        }
      }
      return utftext;
    }

    string = utf8Encode(string); x = convertToWordArray(string);
    a = 0x67452301; b = 0xEFCDAB89; c = 0x98BADCFE; d = 0x10325476;
    for (k = 0; k < x.length; k += 16) {
      AA = a; BB = b; CC = c; DD = d;
      a = FF(a, b, c, d, x[k + 0], S11, 0xD76AA478); d = FF(d, a, b, c, x[k + 1], S12, 0xE8C7B756);

      c = FF(c, d, a, b, x[k + 10], S13, 0xFFFF5BB1); b = FF(b, c, d, a, x[k + 11], S14, 0x895CD7BE);
      a = FF(a, b, c, d, x[k + 12], S11, 0x6B901122); d = FF(d, a, b, c, x[k + 13], S12, 0xFD987193);
      c = FF(c, d, a, b, x[k + 14], S13, 0xA679438E); b = FF(b, c, d, a, x[k + 15], S14, 0x49B40821);
      a = GG(a, b, c, d, x[k + 1], S21, 0xF61E2562); d = GG(d, a, b, c, x[k + 6], S22, 0xC040B340);
      c = GG(c, d, a, b, x[k + 11], S23, 0x265E5A51); b = GG(b, c, d, a, x[k + 0], S24, 0xE9B6C7AA);
      a = GG(a, b, c, d, x[k + 5], S21, 0xD62D1056); d = GG(d, a, b, c, x[k + 10], S22, 0x2441453);
      c = GG(c, d, a, b, x[k + 15], S23, 0xD8A1E681); b = GG(b, c, d, a, x[k + 4], S24, 0xE7D3FBC8);
      a = GG(a, b, c, d, x[k + 9], S21, 0x21E1CDE6); d = GG(d, a, b, c, x[k + 14], S22, 0xC33707D6);
      c = GG(c, d, a, b, x[k + 3], S23, 0xF4D50D87); b = GG(b, c, d, a, x[k + 8], S24, 0x455A14ED);
      a = GG(a, b, c, d, x[k + 13], S21, 0xA9E3E905); d = GG(d, a, b, c, x[k + 2], S22, 0xFCEFA3F8);
      c = GG(c, d, a, b, x[k + 7], S23, 0x676F02D9); b = GG(b, c, d, a, x[k + 12], S24, 0x8D2A4C8A);
      a = HH(a, b, c, d, x[k + 5], S31, 0xFFFA3942); d = HH(d, a, b, c, x[k + 8], S32, 0x8771F681);
      c = HH(c, d, a, b, x[k + 11], S33, 0x6D9D6122); b = HH(b, c, d, a, x[k + 14], S34, 0xFDE5380C);
      a = HH(a, b, c, d, x[k + 1], S31, 0xA4BEEA44); d = HH(d, a, b, c, x[k + 4], S32, 0x4BDECFA9);
      c = HH(c, d, a, b, x[k + 7], S33, 0xF6BB4B60); b = HH(b, c, d, a, x[k + 10], S34, 0xBEBFBC70);
      a = HH(a, b, c, d, x[k + 13], S31, 0x289B7EC6); d = HH(d, a, b, c, x[k + 0], S32, 0xEAA127FA);
      c = HH(c, d, a, b, x[k + 3], S33, 0xD4EF3085); b = HH(b, c, d, a, x[k + 6], S34, 0x4881D05);
      a = HH(a, b, c, d, x[k + 9], S31, 0xD9D4D039); d = HH(d, a, b, c, x[k + 12], S32, 0xE6DB99E5);
      c = HH(c, d, a, b, x[k + 15], S33, 0x1FA27CF8); b = HH(b, c, d, a, x[k + 2], S34, 0xC4AC5665);
      a = II(a, b, c, d, x[k + 0], S41, 0xF4292244); d = II(d, a, b, c, x[k + 7], S42, 0x432AFF97);
      c = II(c, d, a, b, x[k + 14], S43, 0xAB9423A7); b = II(b, c, d, a, x[k + 5], S44, 0xFC93A039);
      a = II(a, b, c, d, x[k + 12], S41, 0x655B59C3); d = II(d, a, b, c, x[k + 3], S42, 0x8F0CCC92);
      c = II(c, d, a, b, x[k + 10], S43, 0xFFEFF47D); b = II(b, c, d, a, x[k + 1], S44, 0x85845DD1);
      a = II(a, b, c, d, x[k + 8], S41, 0x6FA87E4F); d = II(d, a, b, c, x[k + 15], S42, 0xFE2CE6E0);
      c = II(c, d, a, b, x[k + 6], S43, 0xA3014314); b = II(b, c, d, a, x[k + 13], S44, 0x4E0811A1);
      a = II(a, b, c, d, x[k + 4], S41, 0xF7537E82); d = II(d, a, b, c, x[k + 11], S42, 0xBD3AF235);
      c = II(c, d, a, b, x[k + 2], S43, 0x2AD7D2BB); b = II(b, c, d, a, x[k + 9], S44, 0xEB86D391);
      a = addUnsigned(a, AA); b = addUnsigned(b, BB); c = addUnsigned(c, CC); d = addUnsigned(d, DD);
    }
    return (wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d)).toLowerCase();
  }

  let deviceId = localStorage.getItem('LKN_DEVICE_ID');
  if (!deviceId) {
    deviceId = 'DEV_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
    localStorage.setItem('LKN_DEVICE_ID', deviceId);
  }

  let currentSV = null;
  let currentCTV = null;
  let ctvLoginTime = ""; // Biến lưu thời gian đăng nhập
  let timerInterval = null;
  let html5Scanner = null;

  function showEl(id) { document.getElementById(id).classList.remove('hidden'); }
  function hideEl(id) { document.getElementById(id).classList.add('hidden'); }

  function switchRole(role) {
    if (role === 'ctv') { hideEl('studentLoginBox'); showEl('ctvLoginBox'); }
    else { hideEl('ctvLoginBox'); showEl('studentLoginBox'); }
  }

  async function callAPI(payload) {
    showEl('loader');
    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      const data = await res.json();
      hideEl('loader');
      return data;
    } catch(e) {
      hideEl('loader');
      alert('Lỗi kết nối máy chủ!'); return null;
    }
  }

  async function handleStudentLogin() {
    const mssv = document.getElementById('svMssv').value.trim();
    const hoTen = document.getElementById('svHoTen').value.trim();
    const lop = document.getElementById('svLop').value.trim();
    if (!mssv || !hoTen || !lop) return alert('Vui lòng nhập đầy đủ thông tin!');

    const res = await callAPI({ action: 'studentLogin', mssv: mssv, hoTen: hoTen, lop: lop, deviceId: deviceId });
    if (!res) return;

    if (res.status === 'success') {
      enterStudentDash(res.student);
    } else if (res.status === 'mismatch' || res.status === 'not_found') {
      if (confirm(res.message)) { await forceUpdateStudent(mssv, hoTen, lop); }
    } else {
      alert(res.message);
    }
  }

  async function forceUpdateStudent(mssv, hoTen, lop) {
    const res = await callAPI({ action: 'updateStudentInfo', mssv: mssv, hoTen: hoTen, lop: lop, deviceId: deviceId });
    if (res && res.status === 'success') {
      alert('Cập nhật thành công!');
      enterStudentDash(res.student);
    }
  }

  function showUpdateModal() {
    const newName = prompt('Nhập lại Họ và Tên chính xác:', currentSV.hoTen);
    const newClass = prompt('Nhập lại Lớp chính xác:', currentSV.lop);
    if (newName && newClass) forceUpdateStudent(currentSV.mssv, newName, newClass);
  }

  function enterStudentDash(svData) {
    currentSV = svData;
    document.getElementById('svNameDisp').innerText = svData.hoTen;
    document.getElementById('svClassDisp').innerText = svData.lop;
    hideEl('studentLoginBox'); showEl('studentDash');
  }

  function openStudentScanner() {
    hideEl('studentDash'); showEl('scannerBox');
    html5Scanner = new Html5Qrcode("reader");
    html5Scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 240 }, onScanSuccess)
      .catch(err => { alert('Lỗi mở Camera: ' + err); closeStudentScanner(); });
  }

  function closeStudentScanner() {
    hideEl('scannerBox'); showEl('studentDash');
    if (html5Scanner) html5Scanner.stop().then(() => html5Scanner.clear()).catch(e => console.log(e));
  }

  async function onScanSuccess(decodedText) {
    closeStudentScanner();
    const res = await callAPI({ action: 'processStudentScan', mssv: currentSV.mssv, deviceId: deviceId, qrData: decodedText });
    if (res) {
      document.getElementById('svStatus').innerText = res.message;
      alert(res.message);
    }
  }

  async function handleCtvLogin() {
    const u = document.getElementById('ctvUser').value.trim();
    const p = document.getElementById('ctvPass').value.trim();
    const res = await callAPI({ action: 'ctvLogin', username: u, password: p });

    if (res && res.success) {
      currentCTV = res;
      
      // Ghi lại chính xác giờ:phút:giây lúc CTV đăng nhập thành công
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      ctvLoginTime = `${hh}:${mm}:${ss}`;

      document.getElementById('stationTitle').innerText = res.tenTram;
      document.getElementById('ctvUserDisp').innerText = res.username;
      hideEl('ctvLoginBox'); showEl('ctvDash');
      document.getElementById('qr-canvas-box').innerText = 'Đang khởi tạo...';

      startCountdown5s();
    } else if (res) {
      alert(res.message);
    }
  }

  function renderQRCode5s() {
    if (!currentCTV) return;
    const box = document.getElementById('qr-canvas-box');
    if (!box) return;
    
    try {
      if (typeof QRCode === 'undefined') throw new Error("Thư viện QR chưa tải xong.");

      const currentBlock = Math.floor(Date.now() / 5000);
      const rawString = SECRET_KEY + "_" + currentCTV.tenTram + "_" + currentBlock;
      const shortToken = customMD5(rawString).substring(0, 8); // Token 8 ký tự

      // Lấy mã viết tắt của trạm (ADNH, TT...)
      const cleanName = currentCTV.tenTram.trim();
      const shortTram = stationCodeMap[cleanName] || cleanName; 

      // Nối trực tiếp thành chuỗi siêu ngắn: ADNH + a1b2c3d4
      const payload = shortTram + shortToken;

      box.innerHTML = '';
      new QRCode(box, {
        text: payload,
        width: 220,
        height: 220,
        colorDark: "#8B1538",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.L,
        version: 40
      });
    } catch (err) {
      console.error('Lỗi vẽ QR:', err);
      box.innerHTML = `<div style="color:#b91c1c; font-size:12px; font-weight:bold; text-align:center; padding:10px;">⚠ ${err.message}</div>`;
    }
  }

  let lastBlock = -1;

  function startCountdown5s() {
    if (timerInterval) clearInterval(timerInterval);
    lastBlock = -1;

    function tick() {
      try {
        if (!currentCTV) return;
        const now = Date.now();
        const secondsLeft = 5 - (Math.floor(now / 1000) % 5);

        const countEl = document.getElementById("time-countdown");
        if (countEl) countEl.innerText = `${secondsLeft}s`;

        const barEl = document.getElementById("progress-bar");
        if (barEl) barEl.style.width = `${(secondsLeft / 5) * 100}%`;

        const block = Math.floor(now / 5000);
        if (block !== lastBlock) {
          lastBlock = block;
          renderQRCode5s();
        }
      } catch(err) {
        console.error("Lỗi đếm ngược:", err);
      }
    }

    tick();
    timerInterval = setInterval(tick, 250);
  }
</script>
